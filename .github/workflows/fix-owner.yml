name: Fix owner.json newline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove trailing newline from owner.json
        run: |
          printf '%s' '{"wallet":"3vRuUVH2YktErxXi3i6eAGc44kqH6wDNkM5miNjexfgE"}' > .makefun/owner.json
          git config user.name "arestafirman"
          git config user.email "arestafirman@users.noreply.github.com"
          git add .makefun/owner.json
          git diff --cached --quiet || git commit -m "Remove trailing newline from owner.json"
          git push
